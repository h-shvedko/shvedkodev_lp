<svg xmlns="http://www.w3.org/2000/svg" width="880" height="400" viewBox="0 0 880 400" font-family="Arial, sans-serif">
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#0D4999"/></marker></defs>
<rect width="880" height="400" fill="white"/>
<text x="440" y="36" text-anchor="middle" font-size="20" font-weight="bold" fill="#222">Ein Abrufzyklus (Beispieljob, fiktiv)</text>
<rect x="20" y="70" width="180" height="80" rx="10" fill="#dde3fd" stroke="#0D4999" stroke-width="2"/>
<text x="110" y="105" text-anchor="middle" font-size="16" font-weight="bold" fill="#222">Suchprofil</text>
<text x="110" y="128" text-anchor="middle" font-size="13" fill="#222">des Nutzers</text>
<line x1="200" y1="110" x2="234" y2="110" stroke="#0D4999" stroke-width="2" marker-end="url(#a)"/>
<rect x="240" y="70" width="180" height="80" rx="10" fill="#dde3fd" stroke="#0D4999" stroke-width="2"/>
<text x="330" y="105" text-anchor="middle" font-size="16" font-weight="bold" fill="#222">OAuth-Token</text>
<text x="330" y="128" text-anchor="middle" font-size="13" fill="#222">Erneuerung vor Ablauf</text>
<line x1="420" y1="110" x2="454" y2="110" stroke="#0D4999" stroke-width="2" marker-end="url(#a)"/>
<rect x="460" y="70" width="180" height="80" rx="10" fill="#dde3fd" stroke="#0D4999" stroke-width="2"/>
<text x="550" y="105" text-anchor="middle" font-size="16" font-weight="bold" fill="#222">Rate Limiter</text>
<text x="550" y="128" text-anchor="middle" font-size="13" fill="#222">Backoff, Wiederholung</text>
<line x1="640" y1="110" x2="674" y2="110" stroke="#0D4999" stroke-width="2" marker-end="url(#a)"/>
<rect x="680" y="70" width="180" height="80" rx="10" fill="#dde3fd" stroke="#0D4999" stroke-width="2"/>
<text x="770" y="105" text-anchor="middle" font-size="16" font-weight="bold" fill="#222">Upwork-GraphQL-API</text>
<text x="770" y="128" text-anchor="middle" font-size="13" fill="#222">nur nötige Felder</text>
<line x1="770" y1="150" x2="770" y2="206" stroke="#0D4999" stroke-width="2" marker-end="url(#a)"/>
<rect x="680" y="210" width="180" height="80" rx="10" fill="#dde3fd" stroke="#0D4999" stroke-width="2"/>
<text x="770" y="245" text-anchor="middle" font-size="16" font-weight="bold" fill="#222">Normalisieren</text>
<text x="770" y="268" text-anchor="middle" font-size="13" fill="#222">Standardwerte, Schemafehler</text>
<line x1="680" y1="250" x2="646" y2="250" stroke="#0D4999" stroke-width="2" marker-end="url(#a)"/>
<rect x="460" y="210" width="180" height="80" rx="10" fill="#dde3fd" stroke="#0D4999" stroke-width="2"/>
<text x="550" y="245" text-anchor="middle" font-size="16" font-weight="bold" fill="#222">Harte Filter + Score</text>
<text x="550" y="268" text-anchor="middle" font-size="13" fill="#222">0 bis 100</text>
<line x1="460" y1="250" x2="426" y2="250" stroke="#0D4999" stroke-width="2" marker-end="url(#a)"/>
<rect x="240" y="210" width="180" height="80" rx="10" fill="#dde3fd" stroke="#0D4999" stroke-width="2"/>
<text x="330" y="245" text-anchor="middle" font-size="16" font-weight="bold" fill="#222">Alert + Entwurf</text>
<text x="330" y="268" text-anchor="middle" font-size="13" fill="#222">Nutzer reicht selbst ein</text>
<line x1="240" y1="250" x2="206" y2="250" stroke="#0D4999" stroke-width="2" marker-end="url(#a)"/>
<rect x="20" y="210" width="180" height="80" rx="10" fill="#0D4999" stroke="#0D4999" stroke-width="2"/>
<text x="110" y="245" text-anchor="middle" font-size="16" font-weight="bold" fill="white">Nach 24 Stunden</text>
<text x="110" y="268" text-anchor="middle" font-size="13" fill="white">Hash, Score, Status</text>
<rect x="20" y="320" width="840" height="60" rx="10" fill="white" stroke="#0D4999" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="440" y="345" text-anchor="middle" font-size="14" fill="#222">Beispiel: "Laravel-Entwickler für eine Buchungsplattform", Festpreis, Auftraggeber in Deutschland</text>
<text x="440" y="367" text-anchor="middle" font-size="14" font-weight="bold" fill="#0D4999">Der vollständige Jobtext wird nach 24 Stunden gelöscht</text>
</svg>
