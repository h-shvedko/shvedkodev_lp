    color: white;
    border: none;
    padding: 8px 16px;
    cursor: pointer;
    border-radius: 4px;">
        Akzeptieren
    </button>
    <button id="cookie-decline" style="
    margin-left: 8px;
    background: transparent;
    color: white;
    border: 1px solid #888;
    padding: 8px 16px;
    cursor: pointer;
    border-radius: 4px;">
        Ablehnen
    </button>
</div>

<script>
    // The banner stays until the visitor decides. Analytics starts only on "accept".
    (function () {
        var banner = document.getElementById('cookie-banner');
        var choice = null;
        try { choice = localStorage.getItem('cookieConsent'); } catch (e) {}
        if (choice) banner.style.display = 'none';
        function decide(value) {
            try { localStorage.setItem('cookieConsent', value); } catch (e) {}
            banner.style.display = 'none';
            if (value === 'accepted') loadAnalytics();
        }
        document.getElementById('cookie-accept').addEventListener('click', function () { decide('accepted'); });
        document.getElementById('cookie-decline').addEventListener('click', function () { decide('declined'); });
    })();
</script>
